<style>
/* Layout: single dark "locker-room scoreboard" column, max 960px, sharp cards, fixed bottom nav. Deliberately dark-only. */
:root{
  --bg:#070A10; --surface:#0E131D; --surface-2:#151C2A; --line:#222C3E;

  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);min-height:100%}
body{font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}

.font-display{font-family:var(--display);letter-spacing:.01em}
h1,h2,h3{text-wrap:balance}
.text-accent{color:var(--accent-hi)} .text-muted{color:var(--muted)} .text-fg{color:var(--fg)} .text-gold{color:var(--gold)} .text-ok{color:var(--ok)} .text-warn{color:var(--warn)}

.unit{font-size:.5em;font-weight:600;color:var(--muted);margin-left:2px;letter-spacing:.04em}

.goal-cell{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}

.launch{display:flex;align-items:center;gap:14px;padding:14px;transition:border-color .15s,transform .15s;cursor:pointer}

.rank{font-family:var(--display);font-weight:800;font-size:1.1rem;color:var(--accent-hi)}

.note.ok{border-left-color:var(--ok)} .note.warn{border-left-color:var(--warn)}

.pill{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-hi);background:rgba(30,123,255,.14);padding:3px 8px;border-radius:2px}

.add-ic{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--accent);color:var(--accent-hi);flex-shrink:0}

.bar-row{grid-template-columns:minmax(76px,104px) 1fr minmax(60px,auto)}
.bar-track{height:18px;background:var(--surface-2);border-radius:1px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hi))}

.live-dot{position:absolute;top:-2px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--bg)}
.tag-est{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:2px}
.daychip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;min-width:92px}

.stat{min-width:0}
.mealstats .big{font-size:clamp(1.6rem,7vw,2.4rem)}
.chips::-webkit-scrollbar{height:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
